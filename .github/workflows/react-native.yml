name: React Native CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  build:
    defaults:
      run:
        working-directory: GraphRNSample
        
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: set up JDK 11
      uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    - name: set up Node
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: GraphRNSample/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Copy settings file
      run: |
        cp ./auth/AuthConfig.example.ts ./auth/AuthConfig.ts
    - name: Lint
      run: npm run lint
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: GraphRNSample/android
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      working-directory: GraphRNSample/android
